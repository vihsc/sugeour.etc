<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sugeour</title>
    <link rel="stylesheet" href="https://vihsc.github.io/sugeour.etc/style.css">
</head>
<body>
    <header>
      <h1>sugeour</h1>
      <nav>
        <a href="https://vihsc.github.io/sugeour.etc/">home</a>
        <a href="">about</a>
        <a href="">contact</a>
      </nav>
      <p>welcome to sugeour! play any free game in this list. we have all of the games</p>
    </header>
    
    <main style="max-width: 960px; margin: 20px auto; text-align: center; padding: 0 15px;">
        <h2 id="playing-text">Now Playing...</h2>
        <br>
        
        <div style="background: #000; border-radius: 8px; overflow: hidden; display: inline-block; width: 100%; max-width: 800px;">
            <!-- Notice the iframe has an id="game-screen" and its src starts blank -->
            <iframe id="game-screen" src="" width="100%" height="600" scrolling="no" frameborder="0" allowfullscreen></iframe>
        </div>
    </main>
    <style>   
    // Your default starting hardcoded dictionary list
    const gameDatabase = {
        "scratch1": { title: "Scratch Project 1", src: "https://mit.edu" }
    };

    // Grab the ?id= parameter
    const urlParams = new URLSearchParams(window.location.search);
    const gameId = urlParams.get('id');

    // Check your browser memory bank for the game ID too!
    const savedGames = JSON.parse(localStorage.getItem('sugeour_custom_games')) || [];
    const customGame = savedGames.find(g => g.id === gameId);

    if (gameId && gameDatabase[gameId]) {
        // Load default game
        document.title = gameDatabase[gameId].title + " - sugeour";
        document.getElementById('game-screen').src = gameDatabase[gameId].src;
    } else if (customGame) {
        // Load the game you added dynamically via JS!
        document.title = customGame.title + " - sugeour";
        document.getElementById('game-screen').src = customGame.src;
    } else {
        document.getElementById('playing-text').innerText = "Game not found.";
    }
    </script>

    <script>
        // 1. A dictionary holding all your game IDs and iframe sources
        const gameDatabase = {
            "Dino": {
                title: "chrome dino",
                src: "https://sciencemathedu.github.io/chrome-dino"
            },
            "fight3": {
                title: "class 1014",
                src: "https://speededu111.github.io/g68/class-1014"
            },
            "ducklife": {
                title: "ducklife",
                src: "https://ducklife.online/1.embed"
            },
            "puzzle1": {
                title: "tricky puzzle game",
                src: "https://speededu111.github.io/g16/class-422"
            },
            "game1": {
                title: "cozy farm game",
                src: "https://scratch.mit.edu/projects/1396100433/embed"
            }
        };

        // 2. Read the "?id=" value from the URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');

        // 3. Find the game in database and update the page elements dynamically
        if (gameId && gameDatabase[gameId]) {
            const gameData = gameDatabase[gameId];
            document.title = gameData.title + " - sugeour";
            document.getElementById('playing-text').innerText = "Now Playing: " + gameData.title;
            document.getElementById('game-screen').src = gameData.src;
        } else {
            // Fallback text if the ID is missing or mistyped
            window.location.href = "https://vihsc.github.io/sugeour.etc/games/410.html"
        }
    </script>
</body>
</html>
