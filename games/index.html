<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sugeour</title>
    <link rel="stylesheet" href="https://vihsc.github.io/sugeour.etc/style.css">
</head>
<body>
    <header>
      <h1>sugeour</h1>
      <nav>
        <a href="https://vihsc.github.io/sugeour.etc/">home</a>
        <a href="https://vihsc.github.io/sugeour.etc/about">about</a>
        <a href="">contact</a>
      </nav>
      <p>welcome to sugeour! play any free game in this list. we have all of the games</p>
    </header>
    
    <main style="max-width: 960px; margin: 20px auto; text-align: center; padding: 0 15px;">
        <h2 id="playing-text">Now Playing...</h2>
        <br>
        
        <div style="background: #000; border-radius: 8px; overflow: hidden; display: inline-block; width: 100%; max-width: 800px;">
            <!-- Notice the iframe has an id="game-screen" and its src starts blank -->
            <iframe id="game-screen" src="" width="100%" height="600" scrolling="no" frameborder="0" allowfullscreen></iframe>
        </div>
    </main>
    <div class="trending">
        <h2>recommened games</h2>
        <!-- This grid is populated automatically via JavaScript -->
        <div class="games" id="rgames-grid"></div>
    </div>

    <script>
        // 1. Get the current game ID from the web link parameter (?id=xxx)
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');

        // 2. Hardcoded fallback list (Your manual entry backup)
        const localDatabase = {
            "Dino": {
                title: "chrome dino",
                src: "https://sciencemathedu.github.io/chrome-dino"
            },
            "fight3": {
                title: "class 1014",
                src: "https://speededu111.github.io/g68/class-1014"
            },
            "ducklife": {
                title: "ducklife 4",
                src: "https://ubghyper.github.io/GameList.github.io/Duck-Life-4/"
            },
            "puzzle1": {
                title: "tricky puzzle game",
                src: "https://speededu111.github.io/g16/class-422"
            },
            "game1": {
                title: "cozy farm game",
                src: "https://scratch.mit.edu/projects/1396100433/embed"
            },
            "minecraft": {
                title: "minecraft",
                src: "https://funny-school.github.io/e1/eaglercraft/"
            },
            "ducklife5": {
                title: "ducklife5",
                src: "https://funny-school.github.io/d2/duck-life-5-treasure-hunt/"
            },
            "FW": {
                title: "fireboy and watergirl",
                src: "https://funny-school.github.io/f1/fireboyandwatergirl/"
            },
            "OvO": {
                title: "OvO",
                src: "https://ubghyper.github.io/GameList.github.io/OvO/"
            },
            "mje": {
                title: "minecraft javascript edition",
                src: "https://ubghyper.github.io/GameList.github.io/Minecraft-Online/"
            },
            "redball": {
                title: "redball",
                src: "https://ubghyper.github.io/GameList.github.io/Red-ball/"
            },
            "oddunity": {
                title: "oddunity online edition",
                src: "https://itch.io/embed-upload/20475864?color=ef9f2b"
            }
        };

        const titleElement = document.getElementById('playing-text');
        const iframeElement = document.getElementById('game-screen');

        if (gameId) {
            // STEP A: First check if the requested ID matches our hardcoded list
            if (localDatabase[gameId]) {
                const gameData = localDatabase[gameId];
                document.title = gameData.title + " - sugeour";
                titleElement.innerText = "Now Playing: " + gameData.title;
                iframeElement.src = gameData.src;
            } else {
                // STEP B: If it's NOT hardcoded, check games.json first
                fetch('../games.json')
                    .then(response => response.json())
                    .then(games => {
                        const game = games.find(g => g.id === gameId);
                        if (game) {
                            document.title = `${game.title} - sugeour`;
                            titleElement.innerText = "Now Playing: " + game.title;
                            iframeElement.src = game.src;
                        } else {
                            // STEP C: If not in games.json, check rgames.json
                            return fetch('../rgames.json').then(response => response.json());
                        }
                    })
                    .then(rgames => {
                        // If the previous step returned rgames (because it wasn't in games.json)
                        if (rgames && Array.isArray(rgames)) {
                            const game = rgames.find(g => g.id === gameId);
                            if (game) {
                                document.title = `${game.title} - sugeour`;
                                titleElement.innerText = "Now Playing: " + game.title;
                                iframeElement.src = game.src;
                            } else {
                                // If it's nowhere, redirect to 410 page
                                titleElement.innerText = "Game Not Found!";
                                window.location.href = "https://vihsc.github.io/sugeour.etc/games/410.html";
                            }
                        }
                    })
                    .catch(err => {
                        console.error("Error reading game databases:", err);
                        titleElement.innerText = "Error loading game database.";
                    });
            }
        } else {
            titleElement.innerText = "No game selected!";
        }
    </script>
    <script>
        // Fetch and load games from your JSON file
        fetch('https://vihsc.github.io/sugeour.etc/rgames.json')
            .then(response => response.json())
            .then(games => {
                const grid = document.getElementById('rgames-grid');
                games.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'gamecard';
                    card.innerHTML = `
                        <img src="${game.img}" alt="${game.title}" style="width:50%; border-radius:4px;">
                        <h3>${game.title}</h3>
                        <a href="index.html?id=${game.id}" class="play-btn">Play Game</a>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(err => console.error("Error loading games list:", err));
    </script>
</body>
</html>
