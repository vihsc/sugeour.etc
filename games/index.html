<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sugeour</title>
    <link rel="stylesheet" href="https://vihsc.github.io/sugeour.etc/style.css">
</head>
<body>
    <header>
      <h1>sugeour</h1>
      <nav>
        <a href="https://vihsc.github.io/sugeour.etc/">home</a>
        <a href="">about</a>
        <a href="">contact</a>
      </nav>
      <p>welcome to sugeour! play any free game in this list. we have all of the games</p>
    </header>
    
    <main style="max-width: 960px; margin: 20px auto; text-align: center; padding: 0 15px;">
        <h2 id="playing-text">Now Playing...</h2>
        <br>
        
        <div style="background: #000; border-radius: 8px; overflow: hidden; display: inline-block; width: 100%; max-width: 800px;">
            <!-- Notice the iframe has an id="game-screen" and its src starts blank -->
            <iframe id="game-screen" src="" width="100%" height="600" scrolling="no" frameborder="0" allowfullscreen></iframe>
        </div>
    </main>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const gameId = urlParams.get('id');

        fetch('../games.json')
            .then(response => response.json())
            .then(games => {
                const game = games.find(g => g.id === gameId);
                if (game) {
                    document.title = `${game.title} - sugeour`;
                    document.getElementById('playing-heading').innerText = game.title;
                    document.getElementById('game-screen').src = game.src;
                } else {
                    document.getElementById('playing-heading').innerText = "Game Not Found!";
                    window.location.href = "https://vihsc.github.io/sugeour.etc/games/410.html"
                }
            });
    </script>
</body>
</html>
