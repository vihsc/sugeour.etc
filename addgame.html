<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sugeour Code Utility</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: monospace; background: #111; color: #fff; padding: 20px; }
        .panel { max-width: 600px; margin: 40px auto; padding: 20px; background: #1a1a1a; border-radius: 8px; border: 1px solid #333; }
        input { width: 100%; padding: 10px; margin: 8px 0 16px 0; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; }
        .output { background: #000; padding: 12px; border-radius: 4px; border: 1px solid #333; color: #39ff14; white-space: pre-wrap; margin-bottom: 20px; font-size: 13px; text-align: left; }
        button { background: #28a745; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; font-size: 15px; }
    </style>
</head>
<body>

<div class="panel">
    <h3>🎮 Sugeour Game Content Builder</h3>
    <hr style="border-color: #333; margin-bottom: 15px;">
    
    <label>Game ID Code (lowercase, no spaces):</label>
    <input type="text" id="id" placeholder="e.g., retro-bowl">

    <label>Game Display Title:</label>
    <input type="text" id="title" placeholder="e.g., Retro Bowl">

    <label>Thumbnail Image File Name (placed in your main directory):</label>
    <input type="text" id="img" placeholder="e.g., retrobowl.png">

    <label>Game Embed Player URL:</label>
    <input type="text" id="src" placeholder="https://...">

    <button onclick="buildSnippets()">Generate Code Elements</button>

    <div id="results" style="display:none; margin-top:25px;">
        <h4>📋 1. Paste this block directly inside your target &lt;div class="games"&gt; layout (index.html):</h4>
        <div class="output" id="html-out"></div>

        <h4>⚙️ 2. Paste this object inside your javascript database framework (games/index.html):</h4>
        <div class="output" id="js-out"></div>
    </div>
</div>

<script>
function buildSnippets() {
    const id = document.getElementById('id').value.trim().toLowerCase().replace(/\s+/g, '-');
    const title = document.getElementById('title').value.trim();
    const img = document.getElementById('img').value.trim();
    const src = document.getElementById('src').value.trim();

    if(!id || !title || !img || !src) return alert("Please fill out all input fields first!");

    // Generates the exact card matching your exact structure, including the image asset tag
    const htmlBlock = `    <div class="gamecard">
        <img src="${img}" alt="${title}" class="game-thumb" style="width:100%; height:auto; border-radius:4px; margin-bottom:8px;">
        <h3>${title}</h3>
        <form action="games/">
            <input type="hidden" name="id" value="${id}">
            <button type="submit" class="play-btn">Play Game</button>
        </form>
    </div>`;

    // Generates the matching dictionary record object
    const jsBlock = `"${id}": {
    title: "${title}",
    src: "${src}"
},`;

    document.getElementById('html-out').innerText = htmlBlock;
    document.getElementById('js-out').innerText = jsBlock;
    document.getElementById('results').style.display = 'block';
}
</script>

</body>
</html>
